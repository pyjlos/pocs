services:
  triton:
    build:
      context: .
      dockerfile: docker/triton.Dockerfile
    command: tritonserver --model-repository=/models
    volumes:
      - ./model_repo:/models
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

  api:
    build:
      context: ./api
    environment:
      - TRITON_URL=triton:8000
    ports:
      - "8080:8080"
    depends_on:
      - triton
